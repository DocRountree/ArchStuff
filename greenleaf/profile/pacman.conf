# pacman.conf used while building the ISO.
# @GREENLEAF_REPO@ is replaced by tools/build-iso.sh with the absolute path of the local repo
# that tools/build-repo.sh produced. The installed system gets the normal Arch pacman.conf.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Local, unsigned repo of Greenleaf and AUR packages built on this machine.
[greenleaf]
SigLevel = Optional TrustAll
Server = file://@GREENLEAF_REPO@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
