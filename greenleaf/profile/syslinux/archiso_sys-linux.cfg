# Greenleaf BIOS boot entries (replaces releng archiso_sys-linux.cfg). The default label stays "arch" to match releng archiso_sys.cfg.

LABEL arch
TEXT HELP
Start the Greenleaf live session with open-source graphics drivers.
ENDTEXT
MENU LABEL Greenleaf live (open drivers)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm

LABEL greenleafnv
TEXT HELP
Start the Greenleaf live session with the NVIDIA driver.
ENDTEXT
MENU LABEL Greenleaf live (NVIDIA drivers)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% module_blacklist=nouveau nvidia_drm.modeset=1

LABEL greenleafsafe
TEXT HELP
Start with basic graphics, for screens that stay blank otherwise.
ENDTEXT
MENU LABEL Greenleaf live (safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm nomodeset

