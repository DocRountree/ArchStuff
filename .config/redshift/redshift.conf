; redshift: warmer screen colours in the evening.
; Uses fixed times instead of a location, so nothing is looked up online.
; Started from ~/.xinitrc. Toggle off/on: pkill -USR1 -x redshift
[redshift]
temp-day=6500
temp-night=4000
fade=1
; dusk fades from 18:00 to 19:30, dawn back from 6:00 to 7:00
dusk-time=18:00-19:30
dawn-time=06:00-07:00
adjustment-method=randr
